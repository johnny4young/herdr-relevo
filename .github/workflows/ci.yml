name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Tests
        working-directory: mods/relevo
        run: node --test 'test/*.test.mjs'
      - name: Tests (relevo-files)
        working-directory: mods/relevo-files
        run: node --test 'test/*.test.mjs'
      - name: Tests (hook)
        run: python3 -m unittest discover -s mods/relevo/test -p '*_test.py'
      - name: Lint
        run: npx --yes eslint@10.13.0 mods
      - name: No machine paths in the mods
        run: "! grep -rIn --exclude-dir=test -e '/Users/' -e '/home/[a-z]' mods layouts keys.json"
